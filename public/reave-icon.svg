    <filter id="reave-icon-lava-blur" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="28"/>
    </filter>

    <linearGradient id="reave-icon-lava-base" x1="64" y1="448" x2="448" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="52%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <style>
      .reave-lava-blob {
        transform-box: fill-box;
        transform-origin: center;
        will-change: transform;
      }

      @keyframes reave-icon-lava-drift-1 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        25% { transform: translate(70px, -40px) scale(1.14); }
        50% { transform: translate(-20px, 30px) scale(0.86); }
        75% { transform: translate(30px, -10px) scale(1.07); }
      }

      @keyframes reave-icon-lava-drift-2 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        25% { transform: translate(50px, 50px) scale(1.15); }
        50% { transform: translate(-30px, -30px) scale(0.88); }
        75% { transform: translate(20px, 30px) scale(1.08); }
      }

      @keyframes reave-icon-lava-drift-3 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        25% { transform: translate(50px, -50px) scale(1.14); }
        50% { transform: translate(-30px, 20px) scale(0.88); }
        75% { transform: translate(20px, -20px) scale(1.07); }
      }

      @keyframes reave-icon-lava-drift-4 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        25% { transform: translate(50px, 50px) scale(1.16); }
        50% { transform: translate(-30px, -20px) scale(0.89); }
        75% { transform: translate(25px, 30px) scale(1.07); }
      }

      @keyframes reave-icon-lava-drift-5 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        25% { transform: translate(50px, -50px) scale(1.17); }
        50% { transform: translate(-30px, 15px) scale(0.89); }
        75% { transform: translate(25px, -20px) scale(1.09); }
      }

      .reave-lava-blob-1 { animation: reave-icon-lava-drift-1 24s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
      .reave-lava-blob-2 { animation: reave-icon-lava-drift-2 28s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
      .reave-lava-blob-3 { animation: reave-icon-lava-drift-3 26s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
      .reave-lava-blob-4 { animation: reave-icon-lava-drift-4 22s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
      .reave-lava-blob-5 { animation: reave-icon-lava-drift-5 30s cubic-bezier(0.45, 0, 0.55, 1) infinite; }

      @media (prefers-reduced-motion: reduce) {
        .reave-lava-blob { animation: none !important; }
      }
