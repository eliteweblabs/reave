<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 9 142 30" fill="none">
  <!--
    Coinbase wordmark — lowercase "coinbase" in their geometric sans-serif.
    The actual brand typeface is a custom geometric sans; Inter/DM Sans is the
    closest web-safe approximation of the round, even-weight letterforms.
  -->
  <text
    x="0"
    y="36"
    font-family="'DM Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="34"
    font-weight="500"
    letter-spacing="-0.5"
    fill="#000"
  >coinbase</text>
</svg>
