<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 72" fill="none">
  <!-- Mohegan Sun emblem: circle enclosed by 4 inward-pointing triangles with outer ray/feather pattern -->
  <!-- Outer feather rays (8 rays radiating from center) -->
  <g transform="translate(36,36)">
    <!-- North ray -->
    <polygon points="0,-28 -4,-18 4,-18" fill="#000"/>
    <!-- NE ray -->
    <polygon points="19.8,-19.8 11.3,-14.1 14.1,-11.3" fill="#000"/>
    <!-- East ray -->
    <polygon points="28,0 18,-4 18,4" fill="#000"/>
    <!-- SE ray -->
    <polygon points="19.8,19.8 14.1,11.3 11.3,14.1" fill="#000"/>
    <!-- South ray -->
    <polygon points="0,28 4,18 -4,18" fill="#000"/>
    <!-- SW ray -->
    <polygon points="-19.8,19.8 -11.3,14.1 -14.1,11.3" fill="#000"/>
    <!-- West ray -->
    <polygon points="-28,0 -18,4 -18,-4" fill="#000"/>
    <!-- NW ray -->
    <polygon points="-19.8,-19.8 -14.1,-11.3 -11.3,-14.1" fill="#000"/>

    <!-- 4 cardinal triangles pointing inward toward center -->
    <!-- Top triangle (pointing down) -->
    <polygon points="0,-22 -10,-10 10,-10" fill="#000"/>
    <!-- Right triangle (pointing left) -->
    <polygon points="22,0 10,-10 10,10" fill="#000"/>
    <!-- Bottom triangle (pointing up) -->
    <polygon points="0,22 10,10 -10,10" fill="#000"/>
    <!-- Left triangle (pointing right) -->
    <polygon points="-22,0 -10,10 -10,-10" fill="#000"/>

    <!-- Inner circle -->
    <circle cx="0" cy="0" r="8" fill="#000"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="3.5" fill="white"/>
  </g>

  <!-- Wordmark: MOHEGAN SUN -->
  <text
    x="78"
    y="30"
    font-family="'Arial Narrow', Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="700"
    letter-spacing="2.5"
    fill="#000"
  >MOHEGAN</text>
  <text
    x="78"
    y="50"
    font-family="'Arial Narrow', Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="700"
    letter-spacing="2.5"
    fill="#000"
  >SUN</text>
</svg>
