<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#213B7D" />
    <link rel="icon" href="./images/logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Client login · Four Leggers</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./demo-notice.js"></script>
  </head>
  <body class="auth-page">
    <div class="util">
      <div class="wrap">
        <a href="./">Back to Four Leggers</a>
        <a href="tel:+19789224182">978.922.4182</a>
      </div>
    </div>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="./">
          <img src="./images/logo.png" alt="Four Leggers" width="68" height="67" />
        </a>
        <a class="btn btn--ghost" href="./">Home</a>
      </div>
    </header>

    <main class="auth-card">
      <img src="./images/logo.png" alt="" width="80" height="79" />
      <h1>Client login</h1>
      <p class="lede">Book daycare and grooms. See upcoming visits for your dogs.</p>
      <form id="login-form" class="form" style="margin-top: 1rem">
        <label class="field">
          <span>Email</span>
          <input type="email" name="email" placeholder="you@example.com" autocomplete="username" required />
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
        </label>
        <button type="submit" class="btn btn--gold btn--wide">Sign in</button>
        <p class="form-note">A live install would email a reset link from here.</p>
      </form>
    </main>
    <script>
      document.getElementById("login-form")?.addEventListener("submit", (event) => {
        event.preventDefault();
        const data = new FormData(event.target);
        const params = new URLSearchParams({
          email: String(data.get("email") || "client@fourleggers.demo"),
          dog: "Maple",
          service: "Daycare",
          when: "This week",
        });
        window.location.href = `./portal.html?${params.toString()}`;
      });
    </script>
  </body>
</html>
