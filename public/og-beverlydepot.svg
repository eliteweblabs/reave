<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c1810;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0f08;stop-opacity:1" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap');
      .title { font-family: 'Playfair Display', serif; font-size: 72px; font-weight: 700; fill: #b8860b; text-anchor: middle; letter-spacing: 2px; }
      .subtitle { font-family: 'Playfair Display', serif; font-size: 48px; font-weight: 400; fill: #f5f1e8; text-anchor: middle; letter-spacing: 1px; font-style: italic; }
      .tagline { font-family: Georgia, serif; font-size: 36px; fill: #b8860b; text-anchor: middle; letter-spacing: 2px; }
      .since { font-family: Georgia, serif; font-size: 24px; fill: #b8860b; text-anchor: middle; letter-spacing: 3px; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative top border -->
  <line x1="200" y1="80" x2="1000" y2="80" stroke="#b8860b" stroke-width="2"/>
  
  <!-- Content -->
  <text x="600" y="150" class="title">BEVERLY DEPOT</text>
  <text x="600" y="240" class="subtitle">Prime Rib • Seafood • Tradition</text>
  <text x="600" y="330" class="tagline">Historic Fine Dining Since 1971</text>
  
  <!-- Decorative dividers -->
  <line x1="400" y1="370" x2="800" y2="370" stroke="#b8860b" stroke-width="1" opacity="0.6"/>
  
  <!-- Footer text -->
  <text x="600" y="480" class="tagline" style="font-size: 28px;">10 Park Street, Beverly, MA</text>
  <text x="600" y="530" class="since">(978) 927-5402</text>
  
  <!-- Bottom border -->
  <line x1="200" y1="580" x2="1000" y2="580" stroke="#b8860b" stroke-width="2"/>
</svg>
