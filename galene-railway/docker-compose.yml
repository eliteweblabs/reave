services:
  galene:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      GALENE_PUBLIC_URL: "http://localhost:8080/"
      GALENE_ADMIN_USERNAME: admin
      GALENE_ADMIN_PASSWORD: local-admin
      GALENE_GROUP_PASSWORD: local-host
      GALENE_RELAY_ONLY: "0"
    volumes:
      - galene-data:/data

volumes:
  galene-data:
